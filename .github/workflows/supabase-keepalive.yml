name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days at 12:00 UTC — well under Supabase's 7-day inactivity pause window.
    - cron: "0 12 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ReefLynk Supabase project
        run: |
          curl -sf -o /dev/null -w "ReefLynk: HTTP %{http_code}\n" \
            -H "apikey: ${{ secrets.REEFLYNK_SUPABASE_ANON_KEY }}" \
            "${{ secrets.REEFLYNK_SUPABASE_URL }}/rest/v1/"

      - name: Ping Smart pAntrI Supabase project
        run: |
          curl -sf -o /dev/null -w "Smart pAntrI: HTTP %{http_code}\n" \
            -H "apikey: ${{ secrets.PANTRI_SUPABASE_ANON_KEY }}" \
            "${{ secrets.PANTRI_SUPABASE_URL }}/rest/v1/"
