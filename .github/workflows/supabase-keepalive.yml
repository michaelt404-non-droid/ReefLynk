name: Supabase Keep-Alive

on:
  schedule:
    # Daily at 12:00 UTC — well under Supabase's 7-day inactivity pause window.
    # Must hit a real table via PostgREST (not /auth/v1/health) — the auth
    # health check never touches Postgres, so it doesn't count as project
    # activity and doesn't prevent the pause.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ReefLynk Supabase project
        run: |
          curl -sf -o /dev/null -w "ReefLynk: HTTP %{http_code}\n" \
            -H "apikey: ${{ secrets.REEFLYNK_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.REEFLYNK_SUPABASE_ANON_KEY }}" \
            "${{ secrets.REEFLYNK_SUPABASE_URL }}/rest/v1/maintenance_tasks?select=*&limit=0"
